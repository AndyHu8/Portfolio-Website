<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/Tab.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Junior Frontend Dev Andy</title>

     <!-- SEO: Beschreibung -->
    <meta
        name="description"
        content="Ich bin Dev Andy, Junior Frontend-Entwickler aus Berlin. Entdecke mein Portfolio, meine Projekte und meine Kenntnisse in HTML, CSS, JavaScript und React."
    />

    <!-- Indexierung -->
    <meta name="robots" content="index, follow" />

    <!-- Sprache und Autor -->
    <meta name="author" content="Dev Andy" />

    <!-- Open Graph: Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />

    <meta
        property="og:title"
        content="Dev Andy | Junior Frontend Developer aus Berlin"
    />

    <meta
        property="og:description"
        content="Entdecke mein Portfolio und meine Projekte im Bereich Frontend-Entwicklung mit HTML, CSS, JavaScript und React."
    />

    <meta
        property="og:image:alt"
        content="Dev Andy – Junior Frontend Developer Portfolio"
    />

    <!-- Twitter / X Vorschau -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
        name="twitter:title"
        content="Dev Andy | Junior Frontend Developer"
    />

    <meta
        name="twitter:description"
        content="Portfolio von Dev Andy – Junior Frontend-Entwicklung mit HTML, CSS, JavaScript und React."
    />

    <!-- Strukturierte Daten: Person -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Dev Andy",
        "url": "https://DEINE-DOMAIN.de/",
        "jobTitle": "Junior Frontend Developer",
        "description": "Junior Frontend-Entwickler mit Kenntnissen in HTML, CSS, JavaScript und React.",
        "knowsAbout": [
            "HTML",
            "CSS",
            "JavaScript",
            "TypeScript",
            "React",
            "Frontend Development",
            "Responsive Web Design",
            "UI/UX Design",
            "CRM-Systeme"
        ],
        "sameAs": [
            "https://github.com/AndyHu8",
            "https://www.linkedin.com/in/andy-hu-berlin/"
        ]
    }
    </script>
  </head>
